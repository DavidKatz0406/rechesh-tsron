<style>
  :root{
    --bg:#EDF1F2;
    --paper:#FFFFFF;
    --ink:#1B2634;
    --ink-soft:#5B6670;
    --line:#D7DEE1;
    --copper:#B5651D;
    --copper-bg:#F6EBDF;
    --pipe-blue:#0A6AB0;
    --pipe-blue-bg:#E4F0F8;
    --success:#3C7A5B;
    --success-bg:#E4F1EA;
    --urgent:#B23A2E;
    --urgent-bg:#F7E7E4;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    font-family:'Assistant', sans-serif;
    color:var(--ink);
    display:flex;
    justify-content:center;
  }
  .app{ width:100%; max-width:460px; min-height:100vh; padding-bottom:90px; position:relative; }

  /* Header */
  .topbar{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 12px; background:var(--bg);
    position:sticky; top:0; z-index:30;
  }
  .brand{ display:flex; align-items:center; gap:10px; min-width:0; }
  .brand-logo{ height:30px; width:auto; }
  .brand-divider{ width:1px; height:22px; background:var(--line); }
  .brand-app-name{ font-family:'Rubik',sans-serif; font-weight:600; font-size:12.5px; color:var(--ink-soft); line-height:1.2; max-width:88px; }

  .cart-btn{
    position:relative;
    width:42px; height:42px;
    border-radius:12px;
    background:var(--ink);
    border:none;
    display:flex; align-items:center; justify-content:center;
    cursor:pointer;
  }
  .cart-count{
    position:absolute; top:-6px; left:-6px;
    background:var(--copper); color:#fff;
    font-size:11px; font-weight:700;
    min-width:19px; height:19px; border-radius:10px;
    display:flex; align-items:center; justify-content:center;
    padding:0 4px;
  }

  /* Intro line */
  .intro{ padding:2px 18px 12px; font-size:13px; color:var(--ink-soft); }
  .intro b{ color:var(--ink); font-weight:600; }

  /* Category tabs */
  .tabs{
    display:flex; gap:8px; padding:0 18px 14px; overflow-x:auto;
  }
  .tab{
    flex-shrink:0;
    padding:9px 16px;
    border-radius:999px;
    background:var(--paper);
    border:1px solid var(--line);
    font-size:13.5px; font-weight:600; color:var(--ink-soft);
    cursor:pointer; white-space:nowrap;
  }
  .tab.active{ background:var(--ink); color:#fff; border-color:var(--ink); }

  .full-search-bar{ display:flex; gap:8px; padding:0 18px 12px; }
  .full-search-bar input{
    flex:1; min-width:0; padding:10px 12px; border-radius:8px; border:1px solid var(--line);
    font-family:'Assistant',sans-serif; font-size:13.5px; background:var(--paper);
  }
  .full-search-bar select{
    padding:10px 8px; border-radius:8px; border:1px solid var(--line);
    font-family:'Assistant',sans-serif; font-size:12.5px; background:var(--paper); max-width:130px;
  }

  /* Product grid */
  .grid{ padding:0 18px; display:flex; flex-direction:column; gap:12px; }
  .card{
    background:var(--paper);
    border:1px solid var(--line);
    border-radius:12px;
    padding:12px;
    display:flex;
    gap:12px;
  }
  .card-img{
    width:72px; height:72px; flex-shrink:0;
    border-radius:8px;
    background:#F5F6F4;
    display:flex; align-items:center; justify-content:center;
    overflow:hidden;
    border:1px solid var(--line);
  }
  .card-img img{ width:100%; height:100%; object-fit:contain; }
  .card-img svg{ width:40px; height:40px; }

  .card-body{ flex:1; min-width:0; display:flex; flex-direction:column; gap:7px; }
  .card-name{ font-size:14px; font-weight:600; line-height:1.3; }
  .card-unit{ font-size:11.5px; color:var(--ink-soft); }

  .price-row{ display:flex; flex-wrap:wrap; gap:6px; }
  .price-chip{
    display:flex; align-items:center; gap:5px;
    font-size:11.5px; font-weight:600;
    padding:4px 9px;
    border-radius:999px;
    background:#F1F3F4; color:var(--ink-soft);
    border:1px solid var(--line);
  }
  .price-chip.best{
    background:var(--success-bg); color:var(--success);
    border-color:var(--success);
  }
  .price-chip .sup-dot{ width:7px; height:7px; border-radius:50%; flex-shrink:0; }

  .card-actions{ display:flex; align-items:center; justify-content:space-between; margin-top:2px; }
  .stepper{ display:flex; align-items:center; gap:0; border:1px solid var(--line); border-radius:8px; overflow:hidden; }
  .stepper button{
    width:28px; height:28px; border:none; background:var(--paper);
    font-size:16px; font-weight:600; color:var(--ink); cursor:pointer;
  }
  .stepper span{ min-width:26px; text-align:center; font-size:13px; font-weight:600; }
  .add-btn{
    background:var(--pipe-blue); color:#fff; border:none;
    font-size:12.5px; font-weight:700; padding:8px 14px;
    border-radius:8px; cursor:pointer;
  }
  .add-btn.added{ background:var(--success); }

  /* Cart drawer */
  .overlay{
    position:fixed; inset:0; background:rgba(27,38,52,0.45);
    z-index:40; display:none;
  }
  .overlay.open{ display:block; }
  .drawer{
    position:fixed; bottom:0; left:0; right:0;
    max-width:460px; margin:0 auto;
    background:var(--bg);
    border-radius:18px 18px 0 0;
    z-index:50;
    max-height:88vh;
    transform:translateY(100%);
    transition:transform .25s ease;
    display:flex; flex-direction:column;
  }
  .drawer.open{ transform:translateY(0); }
  .drawer-head{
    display:flex; align-items:center; justify-content:space-between;
    padding:16px 18px 10px;
  }
  .drawer-head h2{ font-family:'Rubik',sans-serif; font-size:16.5px; font-weight:700; }
  .drawer-close{ background:none; border:none; font-size:20px; color:var(--ink-soft); cursor:pointer; }
  .drawer-body{ overflow-y:auto; padding:0 18px 18px; }

  .cart-line{
    display:flex; align-items:center; gap:10px;
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:10px 12px; margin-bottom:8px;
  }
  .cart-line-name{ font-size:13px; font-weight:600; }
  .cart-line-sub{ font-size:11px; color:var(--ink-soft); margin-top:2px; }
  .cart-line-right{ margin-right:auto; text-align:left; display:flex; flex-direction:column; align-items:flex-end; gap:6px; }
  .cart-line-price{ font-size:13px; font-weight:700; }
  .remove-btn{ background:none; border:none; color:var(--urgent); font-size:11.5px; font-weight:600; cursor:pointer; }

  .empty-cart{ text-align:center; padding:40px 20px; color:var(--ink-soft); font-size:13.5px; }

  .mode-toggle{
    display:flex; background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:4px; margin:14px 0 12px; gap:4px;
  }
  .mode-btn{
    flex:1; text-align:center; padding:8px 6px; font-size:12px; font-weight:600;
    color:var(--ink-soft); border-radius:7px; cursor:pointer; border:none; background:transparent;
    line-height:1.25;
  }
  .mode-btn.active{ background:var(--ink); color:#fff; }

  .compare-box{
    background:var(--paper); border:1px solid var(--line); border-radius:10px;
    padding:12px 14px; margin-bottom:12px;
  }
  .compare-row{ display:flex; justify-content:space-between; font-size:12.5px; padding:5px 0; color:var(--ink-soft); }
  .compare-row.winner{ color:var(--success); font-weight:700; }
  .compare-note{ font-size:11.5px; color:var(--copper); margin-top:8px; font-weight:600; }

  .summary{ background:var(--paper); border:1px solid var(--line); border-radius:10px; padding:14px; }
  .summary-row{ display:flex; justify-content:space-between; font-size:13px; padding:4px 0; }
  .summary-row.total{ font-size:16px; font-weight:700; border-top:1px solid var(--line); margin-top:6px; padding-top:10px; }

  .send-btn{
    width:100%; background:var(--copper); color:#fff; border:none;
    font-size:15px; font-weight:700; padding:14px; border-radius:12px;
    margin-top:14px; cursor:pointer; font-family:'Rubik',sans-serif;
  }

  .toast{
    position:fixed; bottom:24px; left:50%; transform:translateX(-50%) translateY(20px);
    background:var(--ink); color:#fff; padding:12px 20px; border-radius:10px;
    font-size:13.5px; font-weight:600; z-index:60; opacity:0; pointer-events:none;
    transition:all .25s ease; white-space:nowrap;
  }
  .toast.show{ opacity:1; transform:translateX(-50%) translateY(0); }
</style>
</head>

let fullSearchCat = '';

function cheapestSupplier(prices){
  let best = null, bestPrice = Infinity;
  for(const sup in prices){
    if(prices[sup] < bestPrice){ bestPrice = prices[sup]; best = sup; }
  }
  return best;
}

function renderTabs(){
  const el = document.getElementById('tabs');
  el.innerHTML = CATEGORIES.map(c => `<div class="tab ${c.id===activeCat?'active':''}" onclick="setCat('${c.id}')">${c.name}</div>`).join('');
}
function setCat(id){ activeCat = id; renderTabs(); renderGrid(); }

function fullCatCardHtml(p){
  const qty = cart[p.id] || 0;
  const sup = cheapestSupplier(p.prices);
  const s = SUPPLIERS[sup];
  return `
  <div class="card">
    <div class="card-img">${ICONS.pipe}</div>
    <div class="card-body">
      <div>
        <div class="card-name">${p.name}</div>
        <div class="card-unit">מק״ט ${p.sku || '—'} · יחידת מידה: ${p.unit}</div>
      </div>
      <div class="price-row"><div class="price-chip best"><span class="sup-dot" style="background:${s.color}"></span>${s.name}: ₪${p.prices[sup].toFixed(2)}</div></div>
      <div class="card-actions">
        <div class="stepper">
          <button onclick="changeQty('${p.id}',1)">+</button>
          <span id="qty-${p.id}">${qty}</span>
          <button onclick="changeQty('${p.id}',-1)">–</button>
        </div>
        <button class="add-btn ${qty>0?'added':''}" id="addbtn-${p.id}" onclick="addToCart('${p.id}')">${qty>0?'בעגלה ✓':'הוסף לעגלה'}</button>
      </div>
    </div>
  </div>`;
}

function renderFullCatalog(){
  const el = document.getElementById('grid');
  const catOptions = `<option value="">כל הקטגוריות</option>` + FULL_CATEGORIES.map(c=>`<option value="${c}" ${c===fullSearchCat?'selected':''}>${c}</option>`).join('');
  let resultsHtml = '';
  const term = fullSearchTerm.trim();
  if(!term && !fullSearchCat){
    resultsHtml = `<div class="empty-cart">הקלידי שם פריט או מק״ט, או בחרי קטגוריה, כדי לחפש מתוך למעלה מ-4,500 פריטים ממחירוני ש.א.ל ואלונים.</div>`;
  } else {
    let matches = FULLCATALOG;
    if(fullSearchCat) matches = matches.filter(p => p.cat === fullSearchCat);
    if(term) matches = matches.filter(p => p.name.includes(term) || (p.sku && p.sku.includes(term)));
    const total = matches.length;
    const shown = matches.slice(0, 60);
    resultsHtml = shown.map(fullCatCardHtml).join('');
    if(total > 60){
      resultsHtml += `<div class="empty-cart">מציגה 60 מתוך ${total} תוצאות — חדדי את החיפוש לצמצום הרשימה</div>`;
    } else if(total === 0){
      resultsHtml = `<div class="empty-cart">לא נמצאו פריטים תואמים</div>`;
    }
  }
  el.innerHTML = `
    <div class="full-search-bar">
      <input type="text" id="fullSearchInput" placeholder="חיפוש לפי שם או מק״ט..." value="${fullSearchTerm.replace(/"/g,'&quot;')}" oninput="onFullSearchInput(this.value)">
      <select id="fullCatSelect" onchange="onFullCatSelect(this.value)">${catOptions}</select>
    </div>
    <div class="grid" style="padding:0">${resultsHtml}</div>
  `;
}
function onFullSearchInput(v){ fullSearchTerm = v; renderFullCatalog(); }
function onFullCatSelect(v){ fullSearchCat = v; renderFullCatalog(); }

function priceChips(p){
  const best = cheapestSupplier(p.prices);
  return Object.keys(p.prices).map(sup => {
    const s = SUPPLIERS[sup];
    const isBest = sup === best;
    return `<div class="price-chip ${isBest?'best':''}">
      <span class="sup-dot" style="background:${s.color}"></span>
      ${s.name}: ₪${p.prices[sup].toFixed(2)}
    </div>`;
  }).join('');
}

function renderGrid(){
  if(activeCat === '__full__'){ renderFullCatalog(); return; }
  const el = document.getElementById('grid');
  const items = PRODUCTS.filter(p => p.cat === activeCat);
  el.innerHTML = items.map(p => {
    const qty = cart[p.id] || 0;
    const media = p.img
      ? `<img src="data:image/jpeg;base64,${IMAGES[p.img]}" alt="">`
      : ICONS[p.icon];
    return `
    <div class="card">
      <div class="card-img">${media}</div>
      <div class="card-body">
        <div>
          <div class="card-name">${p.name}</div>
          <div class="card-unit">יחידת מידה: ${p.unit}</div>
        </div>
        <div class="price-row">${priceChips(p)}</div>
        <div class="card-actions">
          <div class="stepper">
            <button onclick="changeQty('${p.id}',1)">+</button>
            <span id="qty-${p.id}">${qty}</span>
            <button onclick="changeQty('${p.id}',-1)">–</button>
          </div>
          <button class="add-btn ${qty>0?'added':''}" id="addbtn-${p.id}" onclick="addToCart('${p.id}')">${qty>0?'בעגלה ✓':'הוסף לעגלה'}</button>
        </div>
      </div>
    </div>`;
  }).join('');
}

function changeQty(id, delta){
  const span = document.getElementById('qty-'+id);
  let v = parseInt(span.textContent) || 0;
  v = Math.max(0, v+delta);
  span.textContent = v;
}
function addToCart(id){
  const span = document.getElementById('qty-'+id);
  const v = parseInt(span.textContent) || 0;
  if(v <= 0){ showToast('בחרי כמות לפני ההוספה'); return; }
  cart[id] = v;
  document.getElementById('addbtn-'+id).classList.add('added');
  document.getElementById('addbtn-'+id).textContent = 'בעגלה ✓';
  updateCartCount();
  showToast('נוסף לעגלה');
}
function updateCartCount(){
  const count = Object.values(cart).reduce((a,b)=>a+b,0);
  const badge = document.getElementById('cartCount');
  if(count>0){ badge.style.display='flex'; badge.textContent = count; }
  else { badge.style.display='none'; }
}

let cartMode = 'split'; // 'split' or 'single'

function computeCompare(){
  const ids = Object.keys(cart);
  const items = ids.map(id => ({p: findProduct(id), qty: cart[id]}));
  let splitTotal = 0;
  items.forEach(it => { splitTotal += it.p.prices[cheapestSupplier(it.p.prices)] * it.qty; });

  const supplierTotals = {};
  Object.keys(SUPPLIERS).forEach(sup => {
    let coversAll = true, total = 0;
    items.forEach(it => {
      if(it.p.prices[sup] === undefined){ coversAll = false; }
      else total += it.p.prices[sup] * it.qty;
    });
    if(coversAll && items.length>0) supplierTotals[sup] = total;
  });

  let bestSingle = null, bestSingleTotal = Infinity;
  Object.keys(supplierTotals).forEach(sup => {
    if(supplierTotals[sup] < bestSingleTotal){ bestSingleTotal = supplierTotals[sup]; bestSingle = sup; }
  });

  return { splitTotal, supplierTotals, bestSingle, bestSingleTotal, items };
}

function renderCart(){
  const body = document.getElementById('drawerBody');
  const ids = Object.keys(cart).filter(id => cart[id] > 0);
  if(ids.length === 0){
    body.innerHTML = `<div class="empty-cart">העגלה ריקה. חזרי לקטלוג והוסיפי פריטים.</div>`;
    return;
  }
  const cmp = computeCompare();
  const useMode = cartMode === 'single' && cmp.bestSingle ? 'single' : 'split';

  let linesHtml = ids.map(id => {
    const p = findProduct(id);
    const qty = cart[id];
    let sup, price;
    if(useMode === 'single'){
      sup = cmp.bestSingle;
      price = p.prices[sup];
    } else {
      sup = cheapestSupplier(p.prices);
      price = p.prices[sup];
    }
    const s = SUPPLIERS[sup];
    return `<div class="cart-line">
      <div>
        <div class="cart-line-name">${p.name}</div>
        <div class="cart-line-sub"><span class="sup-dot" style="display:inline-block;width:6px;height:6px;border-radius:50%;background:${s.color};margin-left:4px;"></span>${s.name} · ${qty} ${p.unit} × ₪${price.toFixed(2)}</div>
      </div>
      <div class="cart-line-right">
        <div class="cart-line-price">₪${(price*qty).toFixed(2)}</div>
        <button class="remove-btn" onclick="removeFromCart('${id}')">הסר</button>
      </div>
    </div>`;
  }).join('');

  const grandNet = useMode === 'single' ? cmp.bestSingleTotal : cmp.splitTotal;
  const vat = grandNet * 0.18;
  const total = grandNet + vat;

  let compareHtml = '';
  const savingsVsSingle = cmp.bestSingle ? (cmp.bestSingleTotal - cmp.splitTotal) : null;

  compareHtml += `<div class="compare-box">
    <div class="compare-row ${useMode==='split'?'winner':''}"><span>פיצול לפי הזול ביותר בכל פריט</span><span>₪${cmp.splitTotal.toFixed(2)}</span></div>`;
  Object.keys(cmp.supplierTotals).forEach(sup => {
    const isWinnerSingle = useMode==='single' && sup===cmp.bestSingle;
    compareHtml += `<div class="compare-row ${isWinnerSingle?'winner':''}"><span>הזמנה מרוכזת אצל ${SUPPLIERS[sup].name}</span><span>₪${cmp.supplierTotals[sup].toFixed(2)}</span></div>`;
  });
  if(savingsVsSingle && savingsVsSingle > 0.01){
    compareHtml += `<div class="compare-note">פיצול בין הספקים חוסך כ-₪${savingsVsSingle.toFixed(2)} לעומת ריכוז אצל ספק יחיד</div>`;
  } else if(cmp.bestSingle){
    compareHtml += `<div class="compare-note">במקרה הזה אין הבדל משמעותי — ריכוז אצל ספק אחד לא פוגע במחיר</div>`;
  }
  compareHtml += `</div>`;

  const modeToggleHtml = `<div class="mode-toggle">
    <button class="mode-btn ${cartMode==='split'?'active':''}" onclick="setCartMode('split')">פיצול לפי מחיר הכי זול</button>
    <button class="mode-btn ${cartMode==='single'?'active':''}" onclick="setCartMode('single')">ריכוז אצל ספק אחד ${cmp.bestSingle?('('+SUPPLIERS[cmp.bestSingle].name+')'):''}</button>
  </div>`;

  const summaryHtml = `<div class="summary">
    <div class="summary-row"><span>סכום ביניים (לפני מע״מ)</span><span>₪${grandNet.toFixed(2)}</span></div>
    <div class="summary-row"><span>מע״מ (18%)</span><span>₪${vat.toFixed(2)}</span></div>
    <div class="summary-row total"><span>סה״כ לתשלום</span><span>₪${total.toFixed(2)}</span></div>
  </div>
  <button class="send-btn" onclick="sendOrder()">שליחת ההזמנה לאישור</button>
  <div style="text-align:center; font-size:11px; color:var(--ink-soft); margin-top:8px;">ייפתח מייל מוכן לשליחה אל שרון (${APPROVER_EMAIL})</div>`;

  body.innerHTML = linesHtml + modeToggleHtml + compareHtml + summaryHtml;
}

function setCartMode(m){ cartMode = m; renderCart(); }

function removeFromCart(id){
  delete cart[id];
  const span = document.getElementById('qty-'+id);
  if(span) span.textContent = '0';
  const btn = document.getElementById('addbtn-'+id);
  if(btn){ btn.classList.remove('added'); btn.textContent = 'הוסף לעגלה'; }
  updateCartCount();
  renderCart();
}

function openCart(){
  renderCart();
  document.getElementById('overlay').classList.add('open');
  document.getElementById('drawer').classList.add('open');
}
function closeCart(){
  document.getElementById('overlay').classList.remove('open');
  document.getElementById('drawer').classList.remove('open');
}
const APPROVER_EMAIL = 'sharon@tsron.co.il';

function sendOrder(){
  const ids = Object.keys(cart).filter(id => cart[id] > 0);
  if(ids.length === 0){ showToast('העגלה ריקה'); return; }

  const cmp = computeCompare();
  const useMode = cartMode === 'single' && cmp.bestSingle ? 'single' : 'split';
  const grandNet = useMode === 'single' ? cmp.bestSingleTotal : cmp.splitTotal;
  const vat = grandNet * 0.18;
  const total = grandNet + vat;

  let lines = [];
  lines.push('הזמנת חומרים חדשה');
  lines.push('תאריך: ' + new Date().toLocaleDateString('he-IL'));
  lines.push('');
  lines.push('פריטים:');
  ids.forEach(id => {
    const p = findProduct(id);
    const qty = cart[id];
    const sup = useMode === 'single' ? cmp.bestSingle : cheapestSupplier(p.prices);
    const price = p.prices[sup];
    const supName = SUPPLIERS[sup].name;
    const skuTxt = p.sku ? (' (מק״ט ' + p.sku + ')') : '';
    lines.push('- ' + p.name + skuTxt + ' | ' + qty + ' ' + p.unit + ' | ספק: ' + supName + ' | ₪' + price.toFixed(2) + ' ליח׳ | סה״כ ₪' + (price*qty).toFixed(2));
  });
  lines.push('');
  lines.push('אופן ההזמנה: ' + (useMode === 'single' ? ('ריכוז אצל ספק אחד — ' + SUPPLIERS[cmp.bestSingle].name) : 'פיצול לפי המחיר הזול ביותר בכל פריט'));
  lines.push('');
  lines.push('סכום ביניים (לפני מע״מ): ₪' + grandNet.toFixed(2));
  lines.push('מע״מ (18%): ₪' + vat.toFixed(2));
  lines.push('סה״כ לתשלום: ₪' + total.toFixed(2));
  lines.push('');
  lines.push('— נשלח מקטלוג ההזמנות של ט.ש. מי רון');

  const fullBody = lines.join('\n');

  // Mobile mail clients (iOS Safari in particular) fail to open when the
  // mailto URL is too long — Hebrew text expands ~6x once percent-encoded.
  // Build a shortened version for the mailto link itself, and always show
  // the full text with a copy button as a guaranteed-working fallback.
  const subject = encodeURIComponent('הזמנת חומרים לאישור — ' + new Date().toLocaleDateString('he-IL'));
  let mailtoBody = encodeURIComponent(fullBody);
  const SAFE_LIMIT = 1500;
  if(mailtoBody.length > SAFE_LIMIT){
    const shortLines = [
      'הזמנת חומרים חדשה',
      'תאריך: ' + new Date().toLocaleDateString('he-IL'),
      '',
      ids.length + ' פריטים בעגלה — הרשימה המלאה ארוכה מדי לפתיחה אוטומטית.',
      'יש להעתיק את הפירוט המלא מהאפליקציה (כפתור "העתקה") ולהדביק כאן.',
      '',
      'סה״כ לתשלום: ₪' + total.toFixed(2),
      '',
      '— נשלח מקטלוג ההזמנות של ט.ש. מי רון'
    ];
    mailtoBody = encodeURIComponent(shortLines.join('\n'));
  }
  const mailtoUrl = 'mailto:' + APPROVER_EMAIL + '?subject=' + subject + '&body=' + mailtoBody;

  // Anchor + click is more reliable than location.href on iOS Safari.
  let link = document.getElementById('mailtoTrigger');
  if(!link){
    link = document.createElement('a');
    link.id = 'mailtoTrigger';
    link.style.display = 'none';
    document.body.appendChild(link);
  }
  link.href = mailtoUrl;
  link.click();

  lastOrderText = fullBody;
  showFallbackPanel();
  closeCart();
}

let lastOrderText = '';
function showFallbackPanel(){
  const panel = document.getElementById('fallbackPanel');
  const ta = document.getElementById('fallbackText');
  ta.value = lastOrderText;
  panel.classList.add('open');
  document.getElementById('overlay').classList.add('open');
}
function closeFallback(){
  document.getElementById('fallbackPanel').classList.remove('open');
  document.getElementById('overlay').classList.remove('open');
}
function copyOrderText(){
  const ta = document.getElementById('fallbackText');
  ta.select();
  ta.setSelectionRange(0, 999999);
  try{
    navigator.clipboard.writeText(ta.value).then(()=>showToast('הועתק! הדביקי במייל ל-' + APPROVER_EMAIL));
  }catch(e){
    document.execCommand('copy');
    showToast('הועתק! הדביקי במייל ל-' + APPROVER_EMAIL);
  }
}

let toastTimer;
function showToast(msg){
  const t = document.getElementById('toast');
  t.textContent = msg;
  t.classList.add('show');
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=> t.classList.remove('show'), 2200);
}

renderTabs();
renderGrid();
</script>
</body>
</html>
